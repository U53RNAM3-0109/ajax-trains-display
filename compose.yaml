name: Ajax-Trains
services:
  client:
    image: node:22.9.0
    volumes:
      - ./client:/usr/src/app
    working_dir: /usr/src/app
    ports:
      - "80:8000"
    command: sh -c "
      chmod +x run.sh &&
      ./run.sh"

  server:
    image: node:22.9.0
    volumes:
      - ./server:/usr/src/app
    working_dir: /usr/src/app
    ports:
      - "82:9000"
    command: sh -c "
      chmod +x run.sh &&
      ./run.sh"